<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рейтинг Днепра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #090d16);
            color: var(--tg-theme-text-color, #fff);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 24px; margin: 5px 0 2px; font-weight: 800; letter-spacing: -0.5px; }
        .subtitle { font-size: 13px; color: #64748b; margin-bottom: 20px; font-weight: 500; }
        
        /* Карточка с глубокой тенью и плавной анимацией свайпа */
        .card {
            background: var(--tg-theme-secondary-bg-color, #131b2e);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 16px;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Классы для анимации улетания карточки */
        .card.slide-left {
            transform: translateX(-120%) rotate(-15deg);
            opacity: 0;
        }
        .card.slide-right {
            transform: translateX(120%) rotate(15deg);
            opacity: 0;
        }

        .photo-container {
            width: 100%;
            height: 360px;
            background: #111; /* Цвет фона на случай пустых или узких фото */
            position: relative;
            overflow: hidden; /* Важно: обрезает всё, что выходит за рамки */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Фото заполнит блок без искажения пропорций (лишнее обрежется) */
            object-position: center; /* Центрирует изображение */
        }
        
        /* Градиент поверх фото, чтобы имя читалось идеально */
        .info-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 20px 18px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            text-align: left;
        }
        .info {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        /* Стильные закругленные кнопки оценки с градиентами */
        .rating-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 14px;
        }
        .rate-btn {
            flex: 1;
            padding: 15px 0;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            color: #fff;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, filter 0.2s ease;
        }
        .rate-btn:active { transform: scale(0.90); filter: brightness(1.2); }
        
        /* Индивидуальные цвета с сочным неоновым оттенком */
        .rate-btn:nth-child(1) { background: linear-gradient(135deg, #f87171, #ef4444); }
        .rate-btn:nth-child(2) { background: linear-gradient(135deg, #fb923c, #f97316); }
        .rate-btn:nth-child(3) { background: linear-gradient(135deg, #facc15, #eab308); color: #000; }
        .rate-btn:nth-child(4) { background: linear-gradient(135deg, #a3e635, #84cc16); color: #000; }
        .rate-btn:nth-child(5) { background: linear-gradient(135deg, #4ade80, #22c55e); }

        .suggest-btn {
            width: 100%;
            padding: 15px;
            border: 2px dashed rgba(56, 189, 248, 0.4);
            border-radius: 16px;
            background: rgba(56, 189, 248, 0.04);
            color: #38bdf8;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .suggest-btn:hover, .suggest-btn:active {
            background: rgba(56, 189, 248, 0.12);
            border-color: #38bdf8;
        }

        .counter { font-size: 12px; color: #64748b; margin-top: 14px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 Рейт учеников</h1>
    <div class="subtitle">67</div>
    
    <div class="card" id="card">
        <div class="photo-container">
            <img id="user-photo" src="" alt="Загрузка...">
            <div class="info-overlay">
                <div class="info" id="user-name">Загрузка анкет...</div>
            </div>
        </div>
    </div>

    <!-- 5 кнопок оценки -->
    <div class="rating-buttons" id="action-buttons">
        <button class="rate-btn" onclick="rate(1)">1🤢</button>
        <button class="rate-btn" onclick="rate(2)">2🙁</button>
        <button class="rate-btn" onclick="rate(3)">3😐</button>
        <button class="rate-btn" onclick="rate(4)">4😀</button>
        <button class="rate-btn" onclick="rate(5)">5😍</button>
    </div>

    <button class="suggest-btn" onclick="suggestPerson()">➕ Предложить человека</button>

    <div class="counter" id="counter"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    
        let profiles = [];
        let currentIndex = 0;
    
        async function initApp() {
            try {
                const res = await fetch("/api/miniapp/profiles", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ init_data: tg.initData })
                });
            
                if (!res.ok) throw new Error("Ошибка загрузки");
                
                const data = await res.json();
                profiles = data.profiles;
            
                // Запускаем предзагрузку всех картинок в фоновом режиме
                preloadImages();
            
                renderProfile();
            } catch (e) {
                console.error(e);
                document.getElementById("user-name").textContent = "Ошибка загрузки данных";
            }
        }
    
        // Функция фоновой предзагрузки изображений
        function preloadImages() {
            profiles.forEach(p => {
                if (p.photo_url) {
                    const img = new Image();
                    img.src = p.photo_url;
                }
            });
        }
    
        function renderProfile() {
            if (profiles.length === 0 || currentIndex >= profiles.length) {
                document.getElementById("card").innerHTML = `
                    <div style="padding: 60px 20px; text-align: center;">
                        <h2 style="margin-bottom: 8px;">Анкеты закончились! 🎉</h2>
                        <p style="font-size: 14px; color: #94a3b8; line-height: 1.4;">Итоги скоро в канале. Предлагай новых людей кнопкой ниже!</p>
                    </div>`;
                document.getElementById("action-buttons").style.display = "none";
                document.getElementById("counter").style.display = "none";
                return;
            }
        
            const p = profiles[currentIndex];
            document.getElementById("user-photo").src = p.photo_url;
            document.getElementById("user-name").textContent = p.name;
            document.getElementById("counter").textContent = `Анкета ${currentIndex + 1} из ${profiles.length}`;
        }
    
        async function rate(score) {
            const card = document.getElementById("card");
            const currentProfile = profiles[currentIndex];
            
            // Тактильный отклик Telegram (вибрация), если поддерживается устройством
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        
            // Низкие оценки улетают влево, высокие вправо
            const slideClass = score <= 2 ? "slide-left" : "slide-right";
            card.classList.add(slideClass);
        
            // Отправка оценки на бэкенд
            try {
                await fetch("/api/miniapp/rate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        init_data: tg.initData,
                        profile_id: currentProfile.id,
                        score: score
                    })
                });
            } catch (e) {
                console.error("Не удалось отправить оценку:", e);
            }
            
            setTimeout(() => {
                currentIndex++;
                renderProfile();
                card.classList.remove("slide-left", "slide-right");
            }, 250);
        }
    
        function suggestPerson() {
            tg.openTelegramLink("https://t.me/truexa67lyceum_bot?start=suggest");
        }
    
        initApp();
</script>

</body>
</html>
